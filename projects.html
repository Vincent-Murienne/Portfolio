<body>
  <div id="site-header"></div>

  <main>
    <!-- PAGE HEADER -->
    <section class="section-hero">
      <div class="container">
        <div class="fade-in">
          <span class="section-eyebrow" data-i18n="projects.eyebrow">Projets</span>
          <h1 data-i18n="projects.title">Mes projets</h1>
          <p class="mt-3 text-muted text-lg max-w-2xl" data-i18n="projects.lead">
            Projets personnels, professionnels et scolaires développés avec Angular, Java Spring Boot, Node.js, TypeScript.
          </p>
          <!--
            aria-label sur la nav : signal d'accessibilité fort,
            pris en compte par Google pour comprendre la structure de la page.
          -->
          <nav class="glass cat-nav" aria-label="Filtrer les projets par catégorie">
            <a href="#personal" data-i18n="projects.cat.personal">Personnels</a>
            <!-- <a href="#professional" data-i18n="projects.cat.professional">Professionnels</a> -->
            <a href="#school" data-i18n="projects.cat.school">Scolaires</a>
          </nav>
        </div>
      </div>
    </section>
    <div id="projects-content"></div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    const CATS = ["personal", "school"];

    globalThis.renderPage = function () {
      const total = PROJECTS.length;
      const lang  = i18n.lang;

      const html = CATS.map(cat => {
        const list  = PROJECTS.filter(p => p.cat === cat);
        const cards = list.map((p, i) => renderProjectCard(p, i * 80)).join("");
        const count = String(list.length).padStart(2, "0") + " /" + String(total).padStart(2, "0");

        return `
          <section id="${cat}" class="section-sm">
            <div class="container">
              <div class="fade-in">
                <div class="flex items-baseline justify-between gap-4 mb-6 pb-4 border-b">
                  <h2 class="text-2xl" data-i18n="projects.cat.${cat}">${i18n.t("projects.cat." + cat)}</h2>
                  <span class="font-mono text-sm text-muted">${count}</span>
                </div>
              </div>
              <div class="grid-3">${cards}</div>
            </div>
          </section>`;
      }).join("");

      document.getElementById("projects-content").innerHTML = html;
      i18n._applyStatic();
      requestAnimationFrame(initFadeIn);
    };
  </script>
</body>
</html>
