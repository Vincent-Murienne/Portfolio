  <!--
    ItemList : permet à Google d'afficher les certifications
    directement dans les résultats de recherche (rich results).
    Adapte les noms si tes certifs réelles sont différentes.
  -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "name": "Certifications de Vincent Murienne",
    "description": "Liste des certifications professionnelles obtenues par Vincent Murienne, développeur web full-stack.",
    "url": "https://vincent-murienne.github.io/Portfolio/certifications.html",
    "author": {
      "@type": "Person",
      "name": "Vincent Murienne",
      "url": "https://vincent-murienne.github.io/Portfolio/"
    }
  }
  </script>

  <!-- ===================== FONTS ===================== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300..700;1,14..32,300..700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/style.css" />
  <script>(function(){var t=localStorage.getItem('theme')||(globalThis.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.classList.toggle('dark',t==='dark')})();</script>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <!-- PAGE HEADER -->
    <section class="section-hero">
      <div class="container">
        <div class="fade-in">
          <span class="section-eyebrow" data-i18n="certs.eyebrow">Certifications</span>
          <h1 data-i18n="certs.title">Mes certifications</h1>
          <p class="mt-3 text-muted text-lg max-w-2xl" data-i18n="certs.lead">
            Certifications et formations obtenues en développement web et cybersécurité.
          </p>
        </div>
      </div>
    </section>

    <!-- CERTIFICATIONS GRID -->
    <section class="section-sm pb-20">
      <div class="container">
        <div class="grid-3" id="certs-grid"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    globalThis.renderPage = function () {
      const grid = document.getElementById("certs-grid");
      if (grid) {
        grid.innerHTML = CERTIFICATIONS.map((c, i) => renderCertCard(c, i * 60)).join("");
      }
      i18n._applyStatic();
      requestAnimationFrame(initFadeIn);
    };
  </script>
</body>
</html>
